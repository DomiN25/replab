<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RepLab – M0 Spikes</title>
  <style>
    body { margin: 0; background: #0b111d; color: #e9eef6; font: 14px/1.5 system-ui, sans-serif; }
    main { max-width: 900px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
    section { background: #131b2b; border: 1px solid #26324a; border-radius: 12px; padding: 12px 16px; }
    h2 { margin: 0 0 8px; font-size: 16px; }
    pre { white-space: pre-wrap; word-break: break-word; background: #0e1524; padding: 8px; border-radius: 8px; max-height: 260px; overflow: auto; font-size: 12px; }
    .ok { color: #46e3ad; } .bad { color: #ff6b6b; } .warn { color: #f5b54a; }
    #board { width: min(92vw, 420px); aspect-ratio: 1; }
    button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid #26324a; background: #1a2438; color: #e9eef6; }
  </style>
</head>
<body>
  <main>
    <h1>M0 Spikes</h1>
    <section><h2>(a) Lichess Opening Explorer</h2><button id="runA">Abfragen</button><pre id="outA">–</pre></section>
    <section><h2>(b) Stockfish 19 Lite Single-Thread im Worker</h2><button id="runB">Analyse Startstellung Tiefe 18</button><pre id="outB">–</pre></section>
    <section><h2>(c) chessground + chessops</h2><div id="board"></div><pre id="outC">–</pre></section>
  </main>
  <script type="module" src="/src/spike/main.ts"></script>
</body>
</html>
